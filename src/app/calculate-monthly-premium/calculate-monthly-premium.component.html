<form [formGroup]="MonthlyPremiumForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Name:</label>
    <input type="text" id="name" formControlName="name" />
  </div>
   <div>
    <label>Age Next Birthday:</label>
    <input type="number" id="age_NextBday" formControlName="age_NextBday" />
  </div>
   <div>
    <label>Date of Birth</label>
    <input type="date" id="MemberDob" formControlName="MemberDob" />
  </div>
   <div>
    <label>Usual Occupation</label>
    <select id="UsualOccupation" class="form-control" (change)="OnOccupationChange($event)">
        <option value="" disabled>--Select Occupation--</option>
            <option *ngFor="let occupation of occupations" [value]="occupation.rating">
                     {{occupation.name}}
            </option> 
    </select>
  </div>
  <div>
    <label>Sum Insured:</label>
    <input type="number" id="sumInsured" formControlName="sumInsured" />
  </div>
</form>
